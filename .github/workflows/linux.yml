name: linux
# Tests everything, then builds the Linux AppImage + .deb with node, Pi 1.4.0, the gui-pi extension, gui-gate and
# Cua Driver 0.38.0 inside. GATE_REF pins the gui-gate commit the app ships.
on:
  push: {branches: [main], tags: ["v*"]}
  pull_request:
  workflow_dispatch:
    inputs:
      test_hooks: {description: "build with test hooks (scripted person answers, for the test box only)", type: boolean, default: false}
env:
  GATE_REF: acaba696272bc49641e978d677bd721cb9f9ffd1  # gui-gate v0.10.2 (tag): the last standalone gui-gate release; same commit in linux.yml / windows.yml / macos.yml
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: cszf1/gui-gate, ref: "${{ env.GATE_REF }}", path: gate, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: sigstore/cosign-installer@v3
      - name: system packages (webkit2gtk for Tauri, AT-SPI)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev at-spi2-core file squashfs-tools
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: "gate -> target\ndesktop -> target"}
      - name: gui-gate build + tests (real binary, fake driver, scripted person)
        working-directory: gate
        run: |
          cargo build --release
          cargo test --release
          GUI_GATE_BIN=target/release/gui-gate GUI_GATE_NO_UPDATE_CHECK=1 python3 -m unittest discover -s tests
      - name: extension tests
        working-directory: packages/gui-pi
        run: node --test test/*.test.ts
      - name: shell core tests
        working-directory: desktop
        env: {GPD_DUMP_MODELS_JSON: "${{ runner.temp }}/models.json"}
        run: cargo test -p gpd-core
      - name: stage resources (pinned node, Pi lock, gate, Cua Driver 0.38.0 by SHA256)
        env: {REQUIRE_SIG: "1"}
        run: scripts/stage-resources.sh "$GITHUB_WORKSPACE/gate"
      - name: the bundled Pi reads the main model key from the environment (models.json apiKey "$GUI_PI_MAIN_KEY")
        run: node scripts/check-pi-key.mjs "$RUNNER_TEMP/models.json" dist/resources/pi
      - name: bundle
        working-directory: desktop/src-tauri
        run: |
          feat=""; if [ "${{ inputs.test_hooks }}" = "true" ]; then feat="--features test-hooks"; fi
          npx -y @tauri-apps/cli@2 build $feat
      - name: AppImage - put the staged resources back unpatched (linuxdeploy rewrote their ELFs; the app checks them against SHA256SUMS)
        run: for a in desktop/target/release/bundle/appimage/*.AppImage; do bash scripts/appimage-restore-resources.sh "$a" dist/resources; done
      - name: release checksums (every bundled file is in resources.SHA256SUMS, checked by the app at start; the packages in SHA256SUMS)
        run: |
          cp dist/resources/SHA256SUMS resources.SHA256SUMS
          ( cd desktop/target/release/bundle && sha256sum appimage/*.AppImage deb/*.deb | sed 's#  [a-z]*/#  #' ) > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gui-pi-desktop-linux-x86_64${{ inputs.test_hooks && '-testhooks' || '' }}
          path: |
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/deb/*.deb
            SHA256SUMS
            resources.SHA256SUMS
            packaging/linux/*.sh
      - name: publish a prerelease (main pushes and manual runs), so a test box can fetch it without a login
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tag="build-${GITHUB_SHA::7}${{ inputs.test_hooks && '-testhooks' || '' }}"
          gh release delete "$tag" -y --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$tag" \
            --notes "CI build of ${GITHUB_SHA::7}; gui-gate ${GATE_REF::7}. ${{ inputs.test_hooks && 'TEST HOOKS ON: scripted person answers; test boxes only.' || '' }}" \
            desktop/target/release/bundle/appimage/*.AppImage desktop/target/release/bundle/deb/*.deb SHA256SUMS resources.SHA256SUMS \
            packaging/linux/appimage-update.sh packaging/linux/uninstall.sh
      - name: version release (tag push -> vX.Y.Z; a manual run on the tag with test_hooks -> vX.Y.Z-testhooks prerelease)
        if: startsWith(github.ref, 'refs/tags/v')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          bash scripts/ci/publish-version.sh linux ${{ inputs.test_hooks && 'testhooks' || 'normal' }} \
            desktop/target/release/bundle/appimage/*.AppImage desktop/target/release/bundle/deb/*.deb SHA256SUMS resources.SHA256SUMS \
            packaging/linux/appimage-update.sh packaging/linux/uninstall.sh
