name: tmp-linux-popup-shot
# temporary (not merged): Linux screenshots of the four person popups of a published testhooks AppImage
on: {push: {branches: [tmp-linux-popup-shot]}}
jobs:
  shot:
    runs-on: ubuntu-22.04
    steps:
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb openbox xdotool imagemagick libfuse2 dbus-x11 libwebkit2gtk-4.1-0 gnome-keyring
      - name: run --demo-popups under Xvfb
        env: {TAG: build-4ef06c8-testhooks}
        run: |
          mkdir -p shot && cd shot
          for f in gui-pi-desktop_0.3.0_amd64.AppImage SHA256SUMS; do curl -sSLO https://github.com/cszf1/gui-pi-desktop/releases/download/$TAG/$f; done
          sha256sum -c SHA256SUMS 2>&1 | grep AppImage | tee summary.txt
          chmod +x *.AppImage
          Xvfb :99 -screen 0 1024x768x24 & sleep 2
          export DISPLAY=:99
          openbox & sleep 2
          echo '{"delay_ms": 7000, "approve": ["yes"], "answer": ["Shuffle labels"], "takeover": ["yes"], "ask_help": ["timeout"]}' > auto.json
          export GUI_PI_HUMAN_AUTO=$PWD/auto.json GUI_PI_DEMO_LEAD_MS=5000
          dbus-run-session -- ./gui-pi-desktop_0.3.0_amd64.AppImage --demo-popups 15 --show-settings > app.stdout.txt 2> app.stderr.txt &
          for i in $(seq 120); do grep -q "self-check\] bundle" app.stderr.txt && break; sleep 1; done
          sleep 3; import -window root 01-main-and-settings.png
          n=1
          for t in approve clarify takeover help; do
            n=$((n+1))
            for i in $(seq 90); do grep -q "\"type\":\"$t\"" app.stdout.txt && break; sleep 1; done
            sleep 2.5; import -window root 0$n-popup-$t.png
          done
          for i in $(seq 90); do pgrep -f "gui-pi-desktop_0.3.0" >/dev/null || break; sleep 1; done
          grep '"demo_reply"' app.stdout.txt | tee -a summary.txt
          grep '\[popup\]' app.stderr.txt | tee -a summary.txt
          grep '\[self-check\]' app.stderr.txt | tee -a summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: linux-popup-shot, path: shot/*.png}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: linux-popup-logs, path: "shot/*.txt"}
