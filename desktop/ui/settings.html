<!doctype html><html><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<div id="store" class="muted"></div>
<fieldset><legend>Main model</legend><div id="main"></div></fieldset>
<fieldset><legend>Reviewer model (required - checks risky and doubtful steps; cannot be turned off)</legend><div id="reviewer"></div></fieldset>
<fieldset><legend>Optional gate roles</legend><div class="muted">Off by default. "Same as reviewer" uses the reviewer's endpoint.</div><div id="roles"></div></fieldset>
<fieldset><legend>Person</legend><div class="row"><label>Answer within (s)</label><input id="timeout" type="number" min="30"></div>
<div class="muted">No answer in time counts as "no".</div></fieldset>
<div style="display:flex;gap:8px"><button class="primary" id="save">Save</button><span id="saved" class="muted"></span></div>
<div id="problems" class="problems"></div>
</main><script src="settings.js"></script></body></html>
