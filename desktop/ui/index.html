<!doctype html><html><head><meta charset="utf-8"><title>gui-pi</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>gui-pi</h1><button id="settings">Settings</button></header>
<main>
<textarea id="task" placeholder="What should the agent do on this computer?"></textarea>
<div style="display:flex;gap:8px;margin-top:6px"><button class="primary" id="start">Start</button><button class="danger" id="stop" disabled>Stop</button><span id="status" class="muted"></span></div>
<div id="msgrow"><input id="message" placeholder="Tell the agent something more (goes to the task as your words)"><button id="send">Send</button></div>
<div id="problems" class="problems"></div>
<div id="log"></div>
</main><script src="main.js"></script></body></html>
