[package]
name = "gpd-core"
version = "0.1.0"
edition = "2021"
description = "gui-pi-desktop core: settings, key slots, child environment, ask-a-person IPC (no GUI dependencies)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
