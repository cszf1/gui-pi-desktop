[package]
name = "gpd-core"
version = "0.3.0"
edition = "2021"
description = "gui-pi-desktop core: settings, key slots, child environment, ask-a-person IPC (no GUI dependencies)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lib]
path = "src/lib.rs"
